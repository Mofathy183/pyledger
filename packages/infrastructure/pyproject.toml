[project]
name = "pyledger-infrastructure"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beanie>=2.1.0",
    "pymongo>=4.17.0",
    "pyledger-shared",
    "pyledger-core",
    "pyledger-config",
]

[tool.uv.sources]
pyledger-shared = { workspace = true }
pyledger-core = { workspace = true }
pyledger-config = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true