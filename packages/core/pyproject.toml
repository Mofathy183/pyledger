[project]
name = "trutina-core"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13.3", "trutina-shared"]

[tool.uv.sources]
trutina-shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
