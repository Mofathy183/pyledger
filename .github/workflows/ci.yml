name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYLEDGER_TEST_MONGO__URI: mongodb://localhost:27017
  PYLEDGER_TEST_MONGO__DB: pyledger_test

jobs:
  # ── Quality Gate 1: Static Analysis ──────────────────────────────
  static_analysis:
    name: "QG1 · Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }

      - run: uv sync --all-packages --frozen

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Ty type check
        run: uv run ty check

      - name: Import boundary contracts
        run: uv run lint-imports

      - name: Marker hygiene
        run: uv run pytest --collect-only -q

  # ── Quality Gate 2: Foundation Packages (shared, config) ─────────
  foundation:
    name: "QG2 · Shared & Config Unit Tests"
    runs-on: ubuntu-latest
    needs: static_analysis
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }

      - run: uv sync --all-packages --frozen
      
      - run: uv run pytest -m "unit and shared" --cov=pyledger --cov-report=term-missing

  # ── Quality Gate 3: Core Modules ─────────────────────────────────
  core:
    name: "QG3 · Core (unit + integration)"
    runs-on: ubuntu-latest
    needs: foundation
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }

      - run: uv sync --all-packages --frozen

      - name: Unit tests
        run: uv run pytest -m "unit and core" --cov=pyledger --cov-report=term-missing

      - name: Integration tests
        run: |
          uv run pytest -m "integration and core"
          code=$?
          [ $code -eq 5 ] && { echo "No integration tests collected."; exit 0; }
          exit $code

  # ── Quality Gate 4: Infrastructure ───────────────────────────────
  infrastructure:
    name: "QG4 · Infrastructure (unit + integration)"
    runs-on: ubuntu-latest
    needs: core
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }

      - run: uv sync --all-packages --frozen

      - name: Unit tests
        run: uv run pytest -m "unit and infra" --cov=pyledger --cov-report=term-missing

      - name: Integration tests
        run: |
          uv run pytest -m "integration and infra"
          code=$?
          [ $code -eq 5 ] && { echo "No integration tests collected."; exit 0; }
          exit $code

  # ── Quality Gate 5: Applications (parallel lanes) ────────────────
  cli:
    name: "QG5 · CLI App (unit + integration)"
    runs-on: ubuntu-latest
    needs: infrastructure
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }

      - run: uv sync --all-packages --frozen

      - name: Unit tests
        run: uv run pytest -m "unit and cli" --cov=pyledger --cov-report=term-missing

      - name: Integration tests
        run: |
          uv run pytest -m "integration and cli"
          code=$?
          [ $code -eq 5 ] && { echo "No integration tests collected."; exit 0; }
          exit $code

  api:
    name: "QG5 · API App (unit + integration)"
    runs-on: ubuntu-latest
    needs: infrastructure
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: uv sync --all-packages --frozen

      - name: Unit tests
        run: uv run pytest -m "unit and api" --cov=pyledger --cov-report=term-missing

      - name: Integration tests
        run: |
          uv run pytest -m "integration and api"
          code=$?
          [ $code -eq 5 ] && { echo "No integration tests collected."; exit 0; }
          exit $code

  # ── Quality Gate 6: Build ─────────────────────────────────────────
  build:
    name: "QG6 · Build"
    runs-on: ubuntu-latest
    needs: [cli, api]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: uv sync --all-packages --frozen

      - name: Build all packages
        run: uv build --all-packages

      - name: Build CLI
        run: uv build --package pyledger-cli

      - name: Build API
        run: uv build --package pyledger-api