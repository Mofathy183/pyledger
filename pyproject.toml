[project]
name = "pyledger"
version = "0.1.0"
description = "A simple command-line bookkeeping system built in Python that simulates how a real accounting system works."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.3",
    "python-dateutil>=2.9.0.post0",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
pyledger = "pyledger.main:app"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["ruff>=0.15.12"]

[tool.setuptools.packages.find]
where = ["src"]
