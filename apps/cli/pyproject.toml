[project]
name = "pyledger-cli"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.25.1",
    "rich>=15.0.0",
    "anyio>=4.14.1",
    "pyledger-core",
    "pyledger-infrastructure",
    "pyledger-config",
]

[tool.uv.sources]
pyledger-core = { workspace = true }
pyledger-infrastructure = { workspace = true }
pyledger-config = { workspace = true }

[project.scripts]
pyledger-cli = "pyledger.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true