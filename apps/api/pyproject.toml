[project]
name = "pyledger-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pyledger-core",
    "pyledger-infrastructure",
    "pyledger-config",
]

[tool.uv.sources]
pyledger-core = { workspace = true }
pyledger-infrastructure = { workspace = true }
pyledger-config = { workspace = true }

[project.scripts]
pyledger-api = "pyledger.api.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
